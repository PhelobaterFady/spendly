$kind: http-request
name: Create Installment
method: POST
url: '{{baseUrl}}/api/installments'
order: 2000
headers:
  - key: x-user-id
    value: '{{x-user-id}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "item_name": "Laptop",
      "total_amount": 1200,
      "monthly_amount": 100,
      "start_date": "2025-05-01"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has id field", function () {
          pm.expect(pm.response.json()).to.have.property("id");
      });

      pm.environment.set("installmentId", pm.response.json().id.toString());

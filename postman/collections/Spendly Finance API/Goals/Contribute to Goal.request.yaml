$kind: http-request
name: Contribute to Goal
method: PATCH
url: '{{baseUrl}}/api/goals/{{goalId}}'
order: 3000
headers:
  - key: x-user-id
    value: '{{x-user-id}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 200,
      "wallet_id": "{{paymentMethodId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

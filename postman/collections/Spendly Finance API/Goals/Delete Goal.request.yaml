$kind: http-request
name: Delete Goal
method: DELETE
url: '{{baseUrl}}/api/goals/{{goalId}}'
order: 4000
headers:
  - key: x-user-id
    value: '{{x-user-id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

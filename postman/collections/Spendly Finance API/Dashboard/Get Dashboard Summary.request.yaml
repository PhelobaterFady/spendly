$kind: http-request
name: Get Dashboard Summary
method: GET
url: '{{baseUrl}}/api/dashboard/summary'
order: 1000
headers:
  - key: x-user-id
    value: '{{x-user-id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has totalIncome, totalExpenses, netBalance fields", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("totalIncome");
          pm.expect(json).to.have.property("totalExpenses");
          pm.expect(json).to.have.property("netBalance");
      });

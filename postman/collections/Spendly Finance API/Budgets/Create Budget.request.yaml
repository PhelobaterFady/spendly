$kind: http-request
name: Create Budget
method: POST
url: '{{baseUrl}}/api/budgets'
order: 2000
headers:
  - key: x-user-id
    value: '{{x-user-id}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "category_id": "{{categoryId}}",
      "limit_amount": 500,
      "month": 5,
      "year": 2025
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has id field", function () {
          pm.expect(pm.response.json()).to.have.property("id");
      });

      pm.environment.set("budgetId", pm.response.json().id.toString());
